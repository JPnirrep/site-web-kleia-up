<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SÉANCE H3 | Coaching Premium | Barnaby</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Ranade:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bordeaux: #8B1D3D;
            --color-gold: #D4AF37;
            --color-text: #1a1a1a;
            --color-bg: #f8f8f8;
            --shadow-premium: 0 20px 50px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-box: border-box; }
        body { 
            background: #e0e0e0; 
            font-family: 'Ranade', sans-serif; 
            color: var(--color-text);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            margin: 0 auto 40px;
            padding: 30mm 25mm;
            box-shadow: var(--shadow-premium);
            position: relative;
            overflow: hidden;
        }

        header {
            border-bottom: 2px solid var(--color-gold);
            padding-bottom: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .logo-kleia { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--color-bordeaux); }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            color: var(--color-bordeaux);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .metadata { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: #666; }

        section { margin-bottom: 40px; }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            color: var(--color-gold);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--color-bordeaux);
            padding-left: 15px;
        }

        .content-placeholder {
            border: 2px dashed #eee;
            padding: 40px;
            text-align: center;
            color: #aaa;
            font-style: italic;
            border-radius: 15px;
        }

        .footer-page {
            position: absolute;
            bottom: 30mm;
            left: 25mm;
            right: 25mm;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="page">
        <header>
            <div class="logo-kleia">KLEIA-UP</div>

        </header>

        <section>

            <div class="content-placeholder">

        </section>

</body>
</html>
