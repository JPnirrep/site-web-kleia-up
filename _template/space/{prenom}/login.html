<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLEIA GATE | Accès Sécurisé</title>
    <link rel="icon" type="image/png" href="/assets/images/kleia-logo-black-hd.png">
    <link rel="stylesheet" href="/space/{prenom}/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Ranade:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 50px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }
        .gate-logo {
            width: 180px;
            margin-bottom: 40px;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-family: 'Ranade', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-text-dim);
            margin-bottom: 10px;
            margin-left: 5px;
        }
        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            font-family: 'Ranade', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--color-gold);
            background: rgba(255, 255, 255, 0.08);
        }
        .visitor-option {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Ranade', sans-serif;
            font-size: 0.9rem;
            color: var(--color-text-dim);
            cursor: pointer;
            transition: color 0.3s;
        }
        .visitor-option:hover { color: var(--color-gold); }
        .visitor-option input { cursor: pointer; accent-color: var(--color-gold); }
        .error-msg {
            color: var(--color-accent-red);
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            font-weight: 700;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="login-card glass-card">
        <img src="/assets/images/kleia-logo-black-hd.png" alt="KLEIA" class="gate-logo">
        <div class="input-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" placeholder="Ex: {Prenom}" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="secretcode">Code Sécurité</label>
            <input type="password" id="secretcode" placeholder="••••-••••-••-••••">
        </div>
        <button id="loginBtn" class="btn-premium" style="width: 100%; padding: 18px;">Autoriser l'accès</button>
        <label class="visitor-option">
            <input type="checkbox" id="isVisitor">
            <span>Option Visiteur : Autoriser (accès restreint)</span>
        </label>
        <div id="errorMessage" class="error-msg">Identifiants non reconnus par le protocole.</div>
    </div>
    <script type="module" src="/space/{prenom}/auth.js"></script>
</body>
</html>
